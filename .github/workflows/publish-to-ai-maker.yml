name: Publish to ai-maker

on:
  workflow_dispatch:

jobs:
  publish:
    name: Sync to marcusash/ai-maker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to ai-maker
        env:
          AIM_TOKEN: ${{ secrets.AI_MAKER_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git clone https://x-access-token:${AIM_TOKEN}@github.com/marcusash/ai-maker.git /tmp/aim

          # Installer files (org has installers/ subdir, public has them at root)
          for f in install-blue.ps1 install-red.ps1 ai-maker-lib.ps1 migrate.ps1; do
            [ -f "installers/$f" ] && cp "installers/$f" /tmp/aim/"$f" && echo "synced $f"
          done

          # install.bat lives at root in both repos
          [ -f "install.bat" ] && cp "install.bat" /tmp/aim/install.bat && echo "synced install.bat"

          # Website pages
          [ -f "index.html" ] && cp "index.html" /tmp/aim/index.html && echo "synced index.html"
          [ -d "pro" ] && cp -r pro /tmp/aim/ && echo "synced pro/"
          [ -d "account-setup" ] && cp -r account-setup /tmp/aim/ && echo "synced account-setup/"
          [ -d "docs" ] && cp -r docs /tmp/aim/ && echo "synced docs/"

          # Release extras
          [ -d "release-extras" ] && cp -r release-extras /tmp/aim/ && echo "synced release-extras/"

          # Skills and agents (for release asset builds)
          [ -d "skills" ] && cp -r skills /tmp/aim/ && echo "synced skills/"
          [ -d "agents" ] && cp -r agents /tmp/aim/ && echo "synced agents/"

          cd /tmp/aim
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git commit -m "sync from marcusash_microsoft/ai-maker"
          git push https://x-access-token:${AIM_TOKEN}@github.com/marcusash/ai-maker.git main
          echo "Published to https://marcusash.github.io/ai-maker/"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.AI_MAKER_TOKEN }}
        run: |
          VERSION=$(grep -oP "Version\s*=\s*'\K[^']+" installers/ai-maker-lib.ps1 || echo "")
          if [ -z "$VERSION" ]; then
            echo "Could not detect version from ai-maker-lib.ps1"
            exit 0
          fi

          TAG="v${VERSION}"

          # Check if release already exists
          if gh release view "$TAG" --repo marcusash/ai-maker &>/dev/null; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi

          # Build release assets
          ASSETS_DIR=$(mktemp -d)
          cp install.bat "$ASSETS_DIR/"
          cp installers/install-blue.ps1 "$ASSETS_DIR/"
          cp installers/install-red.ps1 "$ASSETS_DIR/"
          cp installers/ai-maker-lib.ps1 "$ASSETS_DIR/"
          cp installers/migrate.ps1 "$ASSETS_DIR/"
          [ -f "release-extras/verify.ps1" ] && cp release-extras/verify.ps1 "$ASSETS_DIR/"
          [ -d "agents" ] && (cd agents && zip -r "$ASSETS_DIR/agents.zip" .)

          cd "$ASSETS_DIR"
          gh release create "$TAG" \
            --repo marcusash/ai-maker \
            --title "$TAG" \
            --notes "Synced from org repo" \
            install.bat install-blue.ps1 install-red.ps1 ai-maker-lib.ps1 migrate.ps1 verify.ps1 agents.zip || true

          echo "Release $TAG created on marcusash/ai-maker"
